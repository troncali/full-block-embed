name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Extract changlog matching tag
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  awk -v tag="$TAG" \
                    'BEGIN { re = "^## " tag "($|[^0-9A-Za-z])" }
                    $0 ~ re { f=1; next }
                    /^## /  { f=0 }
                    f' CHANGELOG.md > release-notes.md

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --notes-file release-notes.md \
                    --draft \
                    main.js manifest.json styles.css
